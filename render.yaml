services:
  - type: web
    name: campusflow-student-registry
    runtime: docker
    plan: free
    region: singapore
    branch: main
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    # Deploy this existing service only after GitHub CI checks for main succeed.
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_DATABASE
        value: student_registry
      - key: MONGODB_URI
        sync: false
